<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain-Centric Development</title>
<meta name="description" content="Domain-Centric Development — coming soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #171d29;
    color: #e8eaf0;
    font-family: 'Space Grotesk', 'Avenir Next', 'Trebuchet MS', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  /* the lockup: the wordmark sits one of its own x-heights below the mark, whose box is the drawing */
  .mark { width: min(30vw, 152px); height: auto; overflow: visible; }
  h1 { margin-top: 0.52em; font-size: clamp(26px, 5vw, 40px); font-weight: 700; letter-spacing: -0.8px; color: #ffffff; }
  h1 .tld { color: #148f96; }
  p { margin-top: 14px; font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,234,240,0.55); }
</style>
</head>
<body>
<main>
  <svg class="mark anim" viewBox="18.4 13 83.2 94" role="img" aria-label="Domain-Centric Development logo: six port nodes on a hexagonal boundary around a teal domain core">
    <polygon points="60,20 94.6,40 94.6,80 60,100 25.4,80 25.4,40" stroke="#e8eaf0" stroke-width="6" stroke-linejoin="round" fill="none"/>
    <circle cx="60" cy="20" r="7" fill="#e8eaf0"/>
    <circle cx="94.6" cy="40" r="7" fill="#e8eaf0"/>
    <circle cx="94.6" cy="80" r="7" fill="#e8eaf0"/>
    <circle cx="60" cy="100" r="7" fill="#e8eaf0"/>
    <circle cx="25.4" cy="80" r="7" fill="#e8eaf0"/>
    <circle cx="25.4" cy="40" r="7" fill="#e8eaf0"/>
    <circle class="core" cx="60" cy="60" r="12" fill="#148f96"/>
  </svg>
  <h1>domaincentric<span class="tld">.dev</span></h1>
  <p>coming soon</p>
</main>
<script>
// The mark at work: a call runs in along a dashed line whose pattern travels towards the core,
// the domain takes it up and lights while doing so, and answers on one or two outgoing ports
// while the call still stands. Nothing moves in between. Values as in the brand's pattern library.
(() => {
  const svg = document.querySelector('svg.anim');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!svg || still) return;
  const NODES = [[60, 20], [94.6, 40], [94.6, 80], [60, 100], [25.4, 80], [25.4, 40]];
  // Ports have a direction. Calls come in at the top and on the left — the driving adapters,
  // web, rest, scheduler, mcp — and answers go out at the two ports at the bottom right, where
  // the driven adapters sit: events and persistence.
  const IN = [0, 1, 5, 4], OUT = [2, 3];
  const CORE = [60, 60], CORE_R = 12, PORT_R = 7, SVGNS = 'http://www.w3.org/2000/svg';
  const TEAL = [20, 143, 150], TEAL_DARK = [13, 107, 112];
  const LINE = 1.4, DASH = 3, GAP = 4, SPEED = 20, OPACITY = 0.8;
  const CALL = 1800, ANSWER = 0.75, TOGETHER = 0.6, AFTER = 150, FADE_IN = 140, FADE_OUT = 224, PAUSE = 5500;

  const core = svg.querySelector('.core');
  const boundary = svg.querySelector('polygon.boundary') || svg.querySelector('polygon:not([mask]):last-of-type');
  const ink = boundary.getAttribute('stroke');

  // the core's brightness is how much light sits in it, never an animation of its own
  const sources = new Set();
  let level = 0, raf = null;
  function paint() {
    let target = 0;
    for (const s of sources) target = Math.max(target, s.amount);
    level += (target - level) * (target > level ? 0.14 : 0.07);
    const c = TEAL_DARK.map((v, i) => Math.round(v + (TEAL[i] - v) * Math.min(1, level)));
    core.setAttribute('fill', `rgb(${c.join(',')})`);
    if (sources.size || level > 0.004) raf = requestAnimationFrame(paint);
    else { raf = null; level = 0; core.setAttribute('fill', `rgb(${TEAL_DARK.join(',')})`); }
  }
  // while the mark moves, the core rests in the darker teal and lights up with each call
  core.setAttribute('fill', `rgb(${TEAL_DARK.join(',')})`);

  function track(index, goesOut) {
    const [nx, ny] = NODES[index];
    const len = Math.hypot(nx - CORE[0], ny - CORE[1]);
    const ux = (nx - CORE[0]) / len, uy = (ny - CORE[1]) / len;
    const rim = [CORE[0] + ux * CORE_R, CORE[1] + uy * CORE_R];
    const edge = [nx - ux * PORT_R, ny - uy * PORT_R];
    return goesOut ? [...rim, ...edge] : [...edge, ...rim];
  }

  let inFlight = 0;
  function run(index, goesOut, life) {
    const [x1, y1, x2, y2] = track(index, goesOut);
    const line = document.createElementNS(SVGNS, 'line');
    for (const [k, v] of Object.entries({ x1, y1, x2, y2, stroke: ink, 'stroke-width': LINE, 'stroke-opacity': 0, 'stroke-dasharray': `${DASH} ${GAP}` }))
      line.setAttribute(k, v);
    svg.insertBefore(line, boundary);
    line.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -SPEED * life / 1000 }], { duration: life, easing: 'linear', fill: 'forwards' });
    line.animate([{ strokeOpacity: 0 }, { strokeOpacity: OPACITY }], { duration: FADE_IN, fill: 'forwards' });
    const fadeOut = line.animate([{ strokeOpacity: OPACITY }, { strokeOpacity: 0 }], { duration: FADE_OUT, delay: life - FADE_OUT, fill: 'forwards' });
    fadeOut.onfinish = () => { line.remove(); inFlight--; };
    inFlight++;
  }

  function call() {
    const outMs = Math.round(CALL * ANSWER);
    const calledOn = IN[Math.floor(Math.random() * IN.length)];
    run(calledOn, false, CALL + outMs * TOGETHER + FADE_OUT);
    const source = { amount: 0 };
    sources.add(source); if (!raf) paint();
    const started = performance.now();
    (function frame(now) {
      const t = Math.min(1, (now - started) / CALL);
      source.amount = Math.min(1, Math.max(0, (t - 0.55) / 0.4));
      if (t < 1) requestAnimationFrame(frame);
    })(started);
    setTimeout(() => {
      const ports = [OUT[Math.floor(Math.random() * OUT.length)]];
      if (Math.random() < 0.35) ports.push(OUT.find(i => i !== ports[0]));
      ports.forEach(i => run(i, true, outMs + FADE_OUT + AFTER));
      setTimeout(() => { source.amount = 0; sources.delete(source); }, outMs * 0.8);
    }, CALL);
    return CALL + outMs + FADE_OUT + AFTER;
  }

  // the mark stands still most of the time; a call is the exception, not a beat
  function loop() {
    if (inFlight > 0) { setTimeout(loop, 150); return; }
    setTimeout(loop, call() + PAUSE * (0.6 + Math.random()));
  }
  setTimeout(loop, 900);
})();
</script>
</body>
</html>
